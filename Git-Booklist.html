<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Git-Booklist.html
    Author:  Claude (Anthropic) — claude.ai
    Version: 2.0 — Pale blue/black theme; Reload button in controls strip;
                   elapsed-time load indicator; blank-line bug fix;
                   split data loading into bl-load-data.js and
                   display into bl-display.js.
    Created: 2026-05-17
    Modified: 2026-05-20
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Claude (Anthropic)">
  <meta name="version" content="2.0">
  <meta name="description" content="Book list search tool">
  <title>Book List</title>
  <style>
    :root {
      --bg: #ddeeff;
      --surface: #c8dff5;
      --border: #9ab8d8;
      --accent: #1a4a7a;
      --accent-dim: #3a6a9a;
      --text: #0a0a0a;
      --text-dim: #445566;
      --mono: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    #status {
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    #controls {
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: flex-end;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .control-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    .btn-row {
      display: flex;
      gap: 0.5rem;
    }

    button {
      background: var(--surface);
      color: var(--accent);
      border: 1px solid var(--accent-dim);
      padding: 0.4rem 0.9rem;
      font-family: var(--mono);
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    button:hover:not(:disabled) {
      background: var(--accent-dim);
      color: var(--bg);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #results {
      font-family: var(--mono);
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .result-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
    }

    .result-block h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 0.75rem;
      font-family: Georgia, serif;
    }

    .result-block pre {
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }

    .placeholder {
      color: var(--text-dim);
      font-style: italic;
      padding: 2rem 0;
    }
  </style>
</head>
<body>

<header>
  <h1>Book List</h1>
  <div id="status">Loading data files…</div>
</header>

<div id="controls">
  <div class="control-group">
    <label>Titles</label>
    <div class="btn-row">
      <button id="titles-first" disabled onclick="showLines('titles', 'first')">First 5</button>
      <button id="titles-last"  disabled onclick="showLines('titles', 'last')">Last 5</button>
    </div>
  </div>

  <div class="control-group">
    <label>Authors</label>
    <div class="btn-row">
      <button id="authors-first" disabled onclick="showLines('authors', 'first')">First 5</button>
      <button id="authors-last"  disabled onclick="showLines('authors', 'last')">Last 5</button>
    </div>
  </div>

  <div class="control-group">
    <label>Data</label>
    <div class="btn-row">
      <button id="reload-btn" disabled onclick="loadData()">↺ Reload</button>
    </div>
  </div>
</div>

<div id="results">
  <p class="placeholder">Use the buttons above to inspect the data files.</p>
</div>

<!-- Load external JS modules first, then initialise -->
<script src="bl-load-data.js"></script>
<script src="bl-display.js"></script>
<script>
  // Load data once on startup — no auto-refresh after this
  loadData();
</script>

</body>
</html>
