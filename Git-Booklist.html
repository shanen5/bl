<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Git-Booklist.html
    Author:  Claude (Anthropic) — claude.ai
    Version: 2.0 — Pale blue/black theme; Reload button in controls strip;
                   elapsed-time load indicator; blank-line bug fix;
                   split data loading into bl-load-data.js and
                   display into bl-display.js.
    Version: 2.1 — Three labeled collapsible sticky sections: Data Loading,
                   Search Controls, Results. Mobile-friendly sizing.
                   Elapsed time display in Data Loading section.
    Version: 2.2 — Fix data age display: fractional days format (e.g. 2.25 days),
                   label changed to "Data loaded X days ago", refreshes every
                   60 seconds via setInterval. Update script tag to bl-load-data.js
                   v1.4 which parses records into structured objects and converts
                   dateRead to JavaScript Date.
    Created:  2026-05-17
    Modified: 2026-05-23
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Claude (Anthropic)">
  <meta name="version" content="2.2">
  <meta name="description" content="Book list search tool">
  <title>Book List</title>
  <style>
    :root {
      --bg: #ddeeff;
      --surface: #c8dff5;
      --border: #9ab8d8;
      --accent: #1a4a7a;
      --accent-dim: #3a6a9a;
      --text: #0a0a0a;
      --text-dim: #445566;
      --mono: 'Courier New', Courier, monospace;
      --section-head: #b0cce8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      padding: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--accent);
      letter-spacing: 0.05em;
      padding: 0.5rem 0 1rem 0;
    }

    /* ── Sticky section headers ── */
    .section-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--section-head);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      padding: 0.5rem 0.8rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      margin-top: 0.75rem;
    }

    .section-header h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
    }

    .section-toggle {
      font-size: 0.75rem;
      color: var(--accent-dim);
      font-family: var(--mono);
    }

    /* ── Section bodies ── */
    .section-body {
      background: var(--bg);
      border: 1px solid var(--border);
      border-top: none;
      padding: 0.75rem 0.8rem;
      overflow: hidden;
      transition: max-height 0.25s ease, padding 0.25s ease;
      max-height: 500px;
    }

    .section-body.collapsed {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    /* ── Data Loading section ── */
    #status {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-family: var(--mono);
      margin-bottom: 0.6rem;
    }

    #elapsed {
      font-size: 0.8rem;
      color: var(--accent);
      font-family: var(--mono);
      margin-bottom: 0.75rem;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    button {
      background: var(--surface);
      color: var(--accent);
      border: 1px solid var(--accent-dim);
      padding: 0.55rem 1rem;
      font-family: var(--mono);
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      min-width: 80px;
    }

    button:hover:not(:disabled) {
      background: var(--accent-dim);
      color: var(--bg);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* ── Search Controls section ── */
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }

    .control-group:last-child {
      margin-bottom: 0;
    }

    .control-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    /* ── Results section ── */
    #results {
      font-family: var(--mono);
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .result-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 0.8rem 1rem;
      margin-bottom: 0.75rem;
    }

    .result-block h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 0.6rem;
      font-family: Georgia, serif;
    }

    .result-block pre {
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }

    .placeholder {
      color: var(--text-dim);
      font-style: italic;
      padding: 1rem 0;
      font-size: 0.9rem;
    }

    /* ── Mobile adjustments ── */
    @media (max-width: 600px) {
      body { padding: 0.5rem; }
      h1 { font-size: 1.2rem; }
      button { padding: 0.65rem 0.8rem; font-size: 1rem; flex: 1; }
    }
  </style>
</head>
<body>

<h1>Book List</h1>

<!-- ── DATA LOADING ── -->
<div class="section-header" onclick="toggleSection('data-loading')">
  <h2>Data Loading</h2>
  <span class="section-toggle" id="data-loading-toggle">▲ hide</span>
</div>
<div class="section-body" id="data-loading">
  <div id="status">Loading data files…</div>
  <div id="elapsed"></div>
  <div class="btn-row">
    <button id="reload-btn" disabled onclick="loadData()">↺ Reload Data</button>
  </div>
</div>

<!-- ── SEARCH CONTROLS ── -->
<div class="section-header" onclick="toggleSection('search-controls')">
  <h2>Search Controls</h2>
  <span class="section-toggle" id="search-controls-toggle">▲ hide</span>
</div>
<div class="section-body" id="search-controls">
  <div class="control-group">
    <label>Titles</label>
    <div class="btn-row">
      <button id="titles-first" disabled onclick="showLines('titles', 'first')">First 5</button>
      <button id="titles-last"  disabled onclick="showLines('titles', 'last')">Last 5</button>
    </div>
  </div>
  <div class="control-group">
    <label>Authors</label>
    <div class="btn-row">
      <button id="authors-first" disabled onclick="showLines('authors', 'first')">First 5</button>
      <button id="authors-last"  disabled onclick="showLines('authors', 'last')">Last 5</button>
    </div>
  </div>
</div>

<!-- ── RESULTS ── -->
<div class="section-header" onclick="toggleSection('results-section')">
  <h2>Results</h2>
  <span class="section-toggle" id="results-section-toggle">▲ hide</span>
</div>
<div class="section-body" id="results-section">
  <div id="results">
    <p class="placeholder">Use the search controls above to query the data files.</p>
  </div>
</div>

<!-- Load external JS modules first, then initialise -->
<script src="bl-load-data.js?v=1.4"></script>
<script src="bl-display.js?v=1.0"></script>
<script>
  function toggleSection(id) {
    const body = document.getElementById(id);
    const toggle = document.getElementById(id + '-toggle');
    const collapsed = body.classList.toggle('collapsed');
    toggle.textContent = collapsed ? '▼ show' : '▲ hide';
  }

  // Update elapsed time display — called at load and every 60 seconds
  function updateElapsed() {
    const el = document.getElementById('elapsed');
    if (!bookData.loadedAt) { el.textContent = ''; return; }
    const days = (Date.now() - bookData.loadedAt.getTime()) / (1000 * 60 * 60 * 24);
    el.textContent = `Data loaded ${days.toFixed(2)} days ago`;
  }

  // Refresh the data age display every 60 seconds
  setInterval(updateElapsed, 60000);

  // Load data once on startup — no auto-refresh after this
  loadData();
</script>

</body>
</html>
